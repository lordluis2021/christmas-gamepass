<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Navidad en OXXO - Panel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #1b5e20, #0d0d0d);
      color: #fff;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: rgba(0, 0, 0, 0.8);
      border-radius: 16px;
      padding: 24px 20px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
    }
    h1 {
      margin-top: 0;
      font-size: 1.5rem;
      text-align: center;
    }
    p {
      font-size: 0.9rem;
      line-height: 1.5;
      text-align: center;
    }
    .tag {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(76, 175, 80, 0.15);
      border: 1px solid rgba(76, 175, 80, 0.6);
      font-size: 0.75rem;
      margin-bottom: 12px;
    }
    .field {
      margin-top: 12px;
      font-size: 0.85rem;
    }
    .field span {
      opacity: 0.8;
    }
    .actions {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    button, a.button-link {
      display: inline-block;
      text-align: center;
      padding: 12px;
      border-radius: 999px;
      border: none;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      text-decoration: none;
      background: linear-gradient(90deg, #ffca28, #ff5722);
      color: #202020;
    }
    .secondary {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #fff;
    }
    .small {
      font-size: 0.75rem;
      opacity: 0.7;
      margin-top: 10px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="tag">Jugador registrado</div>
    <h1>Navidad en OXXO 🎄</h1>
    <p id="welcome-text">
      Cargando tus datos...

    <div id="user-info" style="display:none;">
      <div class="field">

      </div>
      <div class="field">
        <span>Correo:</span><br />
        <strong id="email-text"></strong>

    </div>

    <div class="actions">

  <a

    rel="noopener"
  >
    Agregar Game Pass a Google Wallet
  </a>

  <button class="secondary" id="reset-btn">
    Cambiar datos de acceso
  </button>
</div>

  <script>
    (function () {
      const STORAGE_KEY = "navidad_oxxo_user";

      const raw = localStorage.getItem(STORAGE_KEY);
      const welcome = document.getElementById("welcome-text");
      const userInfo = document.getElementById("user-info");
      const phoneText = document.getElementById("phone-text");
      const emailText = document.getElementById("email-text");
      const resetBtn = document.getElementById("reset-btn");

      if (!raw) {
        // Si no hay datos, volvemos al registro
        window.location.href = "index.html";
        return;
      }

      let user;
      try {
        user = JSON.parse(raw);
      } catch (e) {
        console.error("No se pudo parsear el usuario:", e);
        window.location.href = "index.html";
        return;
      }

      welcome.textContent = "Hola, " + (user.email || "jugador") + ". ¡Bienvenido a Navidad en OXXO!";
      phoneText.textContent = user.phone || "-";
      emailText.textContent = user.email || "-";
      userInfo.style.display = "block";

      resetBtn.addEventListener("click", function () {
        if (confirm("Esto borrará los datos guardados en este navegador. ¿Continuar?")) {
          localStorage.removeItem(STORAGE_KEY);
          window.location.href = "index.html";
        }
      });
    })();
  </script>
  <!-- Firebase SDKs (modo compat) -->
<!-- Firebase SDKs (modo compat) -->
<script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-messaging-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-firestore-compat.js"></script>  

 <script>
  // Config de Firebase (la misma que ya tienes)
  const firebaseConfig = {
  apiKey: "AIzaSyBCqxfR74vgZ2dIo6mKbNJIx0Nw4PsjVJU",
  authDomain: "christmas-gamepass.firebaseapp.com",
  projectId: "christmas-gamepass",
  storageBucket: "christmas-gamepass.firebasestorage.app",
  messagingSenderId: "335985713484",
  appId: "1:335985713484:web:9f2db5a010d89995046fe9"
  };

  firebase.initializeApp(firebaseConfig);
  const messaging = firebase.messaging();
  const db = firebase.firestore();

  const STORAGE_KEY = "navidad_oxxo_user";

  if ("serviceWorker" in navigator) {
    (async () => {
      try {
        // 1) Registrar el SW
        const registration = await navigator.serviceWorker.register("./firebase-messaging-sw.js");
        console.log("Service worker registrado con scope:", registration.scope);

        // 2) Pedir permiso de notificaciones
        const permission = await Notification.requestPermission();
        console.log("Permiso de notificaciones:", permission);

        if (permission !== "granted") {
          console.log("El usuario no aceptó las notificaciones.");
          return;
        }

        // 3) Obtener token de FCM
        const currentToken = await messaging.getToken({
          vapidKey: "BGLdFxiAOYkIx6Ck5zleBy1_BrgojS8n0PfrFLmpTIc6YJY5d2TT5d5Glr17Y18UD2U8R4L-1GWL7dB7SMX00bk",
          serviceWorkerRegistration: registration
        });

        if (!currentToken) {
          console.log("No se pudo obtener token de FCM (token vacío).");
          return;
        }

        console.log("FCM token para este dispositivo:");
        console.log(currentToken);

        // 4) Leer datos del usuario desde localStorage
        const rawUser = localStorage.getItem(STORAGE_KEY);
        if (!rawUser) {
          console.log("No hay usuario en localStorage, no se guarda en Firestore.");
          return;
        }

        let user;
        try {
          user = JSON.parse(rawUser);
        } catch (e) {
          console.error("Error parseando usuario de localStorage:", e);
          return;
        }

        const now = new Date().toISOString();

        // 5) Guardar/actualizar en Firestore
        const docId = user.email || user.phone || currentToken; // identificador básico
        await db.collection("players").doc(docId).set(
          {
            phone: user.phone || null,
            email: user.email || null,
            fcmToken: currentToken,
            updatedAt: now,
            createdAt: user.createdAt || now
          },
          { merge: true }
        );

        console.log("Jugador guardado/actualizado en Firestore:", docId);
      } catch (err) {
        console.error("Error en configuración de FCM / Firestore:", err);
      }
    })();
  } else {
    console.log("Service workers no soportados en este navegador.");
  }
</script>


</body>
</html>
