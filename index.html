<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Navidad en OXXO - Registro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #b71c1c, #1b1b1b);
      color: #fff;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: rgba(0, 0, 0, 0.75);
      border-radius: 16px;
      padding: 24px 20px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
    }
    h1 {
      margin-top: 0;
      font-size: 1.5rem;
      text-align: center;
    }
    p {
      font-size: 0.9rem;
      line-height: 1.4;
      text-align: center;
    }
    label {
      display: block;
      margin-top: 16px;
      font-size: 0.85rem;
    }
    input {
      width: 100%;
      margin-top: 6px;
      padding: 10px;
      border-radius: 10px;
      border: none;
      font-size: 0.9rem;
      box-sizing: border-box;
    }
    input:focus {
      outline: 2px solid #ffeb3b;
    }
    button {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      border-radius: 999px;
      border: none;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      background: linear-gradient(90deg, #ffca28, #ff5722);
      color: #202020;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .error {
      color: #ff8a80;
      font-size: 0.8rem;
      margin-top: 8px;
      min-height: 1.2em;
    }
    .small {
      font-size: 0.75rem;
      opacity: 0.8;
      margin-top: 12px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Navidad en OXXO 🎄</h1>
    <p>
      Bienvenido al hub del minijuego.<br />
      Déjanos tu teléfono y correo para continuar.
    </p>

    <form id="signup-form" autocomplete="on">
      <label for="phone">Número de teléfono</label>
      <input
        id="phone"
        name="phone"
        type="tel"
        placeholder="10 dígitos"
        required
      />

      <label for="email">Correo electrónico</label>
      <input
        id="email"
        name="email"
        type="email"
        placeholder="tunombre@correo.com"
        required
      />

      <div class="error" id="error"></div>

      <button type="submit" id="submit-btn">Continuar</button>

      <div class="small">
        La próxima vez que entres desde este dispositivo<br />
        te llevaremos directo al panel principal.
      </div>
    </form>
  </div>

  <script>
    (function () {
      const STORAGE_KEY = "navidad_oxxo_user";

      // Si ya hay datos guardados, redirigimos directo a la "app"
      const existingRaw = localStorage.getItem(STORAGE_KEY);
      if (existingRaw) {
        window.location.href = "app.html";
        return;
      }

      const form = document.getElementById("signup-form");
      const errorBox = document.getElementById("error");
      const submitBtn = document.getElementById("submit-btn");

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        errorBox.textContent = "";

        const phone = form.phone.value.trim();
        const email = form.email.value.trim().toLowerCase();

        if (!phone || !email) {
          errorBox.textContent = "Completa ambos campos para continuar.";
          return;
        }

        if (!/^\d{10}$/.test(phone)) {
          errorBox.textContent = "El teléfono debe tener 10 dígitos.";
          return;
        }

        if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) {
          errorBox.textContent = "Ingresa un correo electrónico válido.";
          return;
        }

        submitBtn.disabled = true;

        const payload = {
          phone,
          email,
          createdAt: new Date().toISOString()
        };

        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
          window.location.href = "app.html";
        } catch (e) {
          console.error(e);
          errorBox.textContent =
            "Ocurrió un error guardando tus datos en este navegador.";
          submitBtn.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
